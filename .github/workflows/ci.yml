name: CI

# Runs the four checks that can be verified without a GPU. The point is that a broken
# import, a bad kwarg, or a metric regression fails here rather than on a rented A100 --
# a `dtype=` vs `torch_dtype=` mismatch once sat in this repo undetected because the
# pinned transformers was never exercised in CI, and it would have killed the first
# GPU run at model load.
#
# Deliberately NOT here: anything needing CUDA (bitsandbytes INT8/INT4, Triton kernels,
# lm-eval). Those stay first-run-on-hardware and are gated by the cheap smoke test in
# thunder/run_all.sh.

on:
  push:
    branches: [main, dev, upgrade-for-research]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU torch, no CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          # The CUDA wheels are ~2.5 GB and pointless on a CPU runner.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install "transformers==4.46.0" "numpy<2" accelerate

      - name: Lint
        run: ruff check src tests tools

      - name: Import graph
        # Static, AST-based: proves every intra-project import resolves without executing
        # anything, so it covers kernels/ and compiler/ which need Triton and CUDA.
        run: python tools/check_imports.py

      - name: Tests
        run: pytest -q

      - name: Metric reproducibility
        # Recomputes the committed drift CSVs from the raw route dumps. Catches a change
        # to drift.py that would silently alter every number in the paper.
        run: python -m routingdrift.quantization.verify_reproducibility

      - name: End-to-end pipeline on a tiny CPU model
        # Builds a ~0.17M-param MoE and runs the real pipeline: model loading, router
        # hooks, drift metrics, the self-consistency and determinism guards, manifest and
        # logging. This is the check that would have caught the from_pretrained kwarg bug.
        run: |
          python tools/make_tiny_moe.py --out /tmp/tiny-olmoe
          python -m routingdrift.quantization.run_experiment \
            --model_name /tmp/tiny-olmoe \
            --precisions fp16 \
            --target_module mlp.gate \
            --output_dir /tmp/ci-run \
            --top_k 2 --max_length 32 --skip_heatmaps
          python -m routingdrift.quantization.verify_reproducibility --results_dir /tmp/ci-run

      - name: Guards actually fired
        # A green pipeline proves nothing if the guards silently degraded to no-ops.
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("/tmp/ci-run/run_manifest.json"))
          guards = m.get("guards") or {}
          rs = guards.get("baseline_self_consistency_rs")
          det = (guards.get("determinism_check") or {}).get("identical")
          print("guards:", json.dumps(guards))
          assert rs == 1.0, f"self-consistency guard did not report exactly 1.0: {rs!r}"
          assert det is True, f"determinism check did not pass: {det!r}"
          assert m.get("status") == "completed", m.get("status")
          print("both guards fired and passed")
          PY

      - name: Upload run artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-run-logs
          path: |
            /tmp/ci-run/logs/
            /tmp/ci-run/run_manifest.json
          if-no-files-found: ignore
